version = 1
name = "Session Lights development"

[setup]
script = "pnpm install --frozen-lockfile && pnpm exec install-electron"

[setup.win32]
script = '''
& powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1
if ($LASTEXITCODE -ne 0) { throw "Dependency setup failed with exit code $LASTEXITCODE." }
'''

[[actions]]
name = "Run"
icon = "run"
command = "pnpm start"
