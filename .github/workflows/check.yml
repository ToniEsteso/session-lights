name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node build/scripts/audit-migration.js
      - run: node build/scripts/update-recovery-test.js
        if: runner.os == 'Windows'
      - run: npm run pack
        if: runner.os == 'Windows'
      - run: npm run test:package -- dist/win-unpacked
        if: runner.os == 'Windows'
      - run: npx electron-builder --config electron-builder.json --mac --dir --config.mac.identity=- --config.mac.notarize=false --publish never
        if: runner.os == 'macOS'
