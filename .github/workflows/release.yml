name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v0.2.0
        required: true
        type: string
      allow_unsigned:
        description: Build an unsigned Windows installer. Unsigned builds cannot update themselves.
        default: false
        type: boolean
      include_mac:
        description: Build signed and notarized Mac installers
        default: false
        type: boolean
permissions:
  contents: read
env:
  # The global virtual store fails on Windows runners, where the store lands on another drive.
  pnpm_config_virtual_store_type: project
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.platform == 'win' || inputs.include_mac
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.platform == 'win' || inputs.include_mac
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        if: matrix.platform == 'win' || inputs.include_mac
        with:
          cache: true
      - name: Validate tag and version
        if: matrix.platform == 'win' || inputs.include_mac
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + v || !/^\d+\.\d+\.\d+$/.test(v)) throw Error('Use a stable version tag that matches package.json');"
      - run: pnpm install --frozen-lockfile
        if: matrix.platform == 'win' || inputs.include_mac
      - run: pnpm run check
        if: matrix.platform == 'win' || inputs.include_mac
      - run: pnpm run build
        if: matrix.platform == 'win' || inputs.include_mac
      - name: Build signed Windows installer
        if: matrix.platform == 'win' && !inputs.allow_unsigned
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --config electron-builder.json --win --x64 --config.forceCodeSigning=true --publish never
      - name: Build unsigned Windows installer
        if: matrix.platform == 'win' && inputs.allow_unsigned
        run: pnpm exec electron-builder --config electron-builder.json --win --x64 --publish never
      - name: Build signed Mac installers
        if: matrix.platform == 'mac' && inputs.include_mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --config electron-builder.json --mac --universal --config.forceCodeSigning=true --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'win' || inputs.include_mac
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node -e "if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) throw Error('Invalid release tag');"
          if gh release view "$RELEASE_TAG" --repo ToniEsteso/session-lights --json isDraft > release.json; then
            node -e "if (!require('./release.json').isDraft) throw Error('Refusing to replace a published release');"
          else
            gh release create "$RELEASE_TAG" --repo ToniEsteso/session-lights --draft --title "Session Lights $RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" installers/* --repo ToniEsteso/session-lights --clobber
