<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Session Lights</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="panel" class="panel" aria-label="Session Lights">
    <header id="handle">
      <div class="wide sort-tools" role="group" aria-label="Sort chats">
        <button data-sort="activity" aria-label="Sort by latest activity" aria-pressed="true">Activity</button>
        <button data-sort="project" aria-label="Group by project" aria-pressed="false">Project</button>
      </div>
      <button class="wide gear" data-settings aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.1-1.8 1-2.1-.5-2.5 4.3 1.5 1.6v2.1l-1.5 1.5L5 19.4l2.1-.5 1.8 1 .6 2.1h5l.6-2.1 1.8-1 2.1.5 2.5-4.3-1.5-1.5v-2.1l1.5-1.6L19 5.6l-2.1.5-1.8-1-.6-2.1z"/><circle cx="12" cy="12.5" r="3.2"/></svg><span class="update-badge" hidden></span></button>
    </header>
    <div id="sessions" role="list" aria-label="Sessions"></div>
    <button id="empty" aria-label="No sessions. Show session list." hidden><span class="empty-dot" aria-hidden="true"></span><span class="wide">No local sessions.</span></button>
    <section id="adapters-hidden" aria-label="All adapters are hidden" hidden>
      <p class="wide">All adapters are hidden.</p>
      <button id="empty-settings" aria-label="All adapters are hidden. Open Settings." aria-haspopup="dialog"><span class="compact empty-dot" aria-hidden="true"></span><span class="wide">Open Settings</span></button>
    </section>
    <section id="usage" aria-label="Usage limits" hidden></section>
    <template id="usage-template">
      <div class="usage-row">
        <button class="usage-gauge"><svg viewBox="0 1 20 12" aria-hidden="true"><path class="gauge-track" d="M2 11a8 8 0 0 1 16 0"/><path class="gauge-fill" d="M2 11a8 8 0 0 1 16 0" pathLength="100"/><path class="gauge-needle" d="M10 11H4"/><circle cx="10" cy="11" r="1"/></svg></button>
        <span class="wide usage-label"></span><div class="wide usage-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="usage-fill"></span></div><span class="wide usage-value"></span>
        <span class="wide usage-reset"></span>
      </div>
    </template>
    <footer>
      <button class="wide hidden-toggle" id="hidden-sessions" aria-expanded="false" aria-controls="sessions" hidden></button>
      <button class="compact gear" data-settings aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.1-1.8 1-2.1-.5-2.5 4.3 1.5 1.6v2.1l-1.5 1.5L5 19.4l2.1-.5 1.8 1 .6 2.1h5l.6-2.1 1.8-1 2.1.5 2.5-4.3-1.5-1.5v-2.1l1.5-1.6L19 5.6l-2.1.5-1.8-1-.6-2.1z"/><circle cx="12" cy="12.5" r="3.2"/></svg><span class="update-badge" hidden></span></button>
      <button id="expand" title="Show session names" aria-label="Show session names" aria-expanded="false"><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M8 4 4 8 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </footer>
    <p class="wide health error" id="error" role="alert" hidden></p>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
