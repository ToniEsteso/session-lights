<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Session Lights</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main id="panel" class="panel" data-view="threads" aria-label="Session Lights">
    <section id="threads-view" class="threads-view" aria-label="Threads">
    <header id="handle" class="panel-handle">
      <div class="wide session-filters" role="group" aria-label="Filter sessions">
        <button data-filter="all" aria-pressed="true">All <span id="all-count" class="count">0</span></button>
        <button data-filter="attention" aria-pressed="false">Attention <span id="attention-count" class="count">0</span></button>
      </div>
      <span id="demo-label" class="wide demo-label" hidden>Demo</span>
      <div class="wide sort-tools" role="group" aria-label="Sort chats">
        <button data-sort="activity" aria-label="Sort by latest activity" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg></button>
        <button data-sort="project" aria-label="Group by project" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></button>
      </div>
      <button class="wide gear" data-settings aria-label="Settings" aria-controls="settings-view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.1-1.8 1-2.1-.5-2.5 4.3 1.5 1.6v2.1l-1.5 1.5L5 19.4l2.1-.5 1.8 1 .6 2.1h5l.6-2.1 1.8-1 2.1.5 2.5-4.3-1.5-1.5v-2.1l1.5-1.6L19 5.6l-2.1.5-1.8-1-.6-2.1z"/><circle cx="12" cy="12.5" r="3.2"/></svg><span class="update-badge" hidden></span></button>
    </header>
    <label class="wide search-field"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4"/><path d="m9.5 9.5 4 4"/></svg><input id="session-search" type="search" aria-label="Search sessions" placeholder="Search" autocomplete="off" spellcheck="false"><kbd id="search-shortcut" aria-hidden="true">Ctrl F</kbd><button id="clear-search" aria-label="Clear search" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg></button></label>
    <section id="no-matches" class="wide empty-state" hidden><strong id="no-matches-title">No matching sessions</strong><button id="reset-filters">Show all sessions</button></section>
    <div id="sessions" role="list" aria-label="Sessions"></div>
    <button id="empty" aria-label="No sessions. Show session list." hidden><span class="empty-dot" aria-hidden="true"></span><span class="wide">No sessions</span></button>
    <p id="empty-help" class="wide empty-help" hidden>Sessions from enabled sources appear here.</p>
    <section id="adapters-hidden" aria-label="All sources are hidden" hidden>
      <p class="wide">All sources are hidden.</p>
      <button id="empty-settings" aria-label="All sources are hidden. Open Settings." aria-controls="settings-view"><span class="compact empty-dot" aria-hidden="true"></span><span class="wide">Open Settings</span></button>
    </section>
    <div id="hide-feedback" class="wide hide-feedback" hidden><span id="hide-message" role="status"></span><button id="undo-hide">Undo</button></div>
    <section id="usage" aria-label="Usage limits" hidden></section>
    <template id="usage-template">
      <div class="usage-row">
        <button class="usage-gauge"><svg viewBox="0 1 20 12" aria-hidden="true"><path class="gauge-track" d="M2 11a8 8 0 0 1 16 0"/><path class="gauge-fill" d="M2 11a8 8 0 0 1 16 0" pathLength="100"/><path class="gauge-needle" d="M10 11H4"/><circle cx="10" cy="11" r="1"/></svg></button>
        <span class="wide usage-label"></span><div class="wide usage-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="usage-fill"></span></div><span class="wide usage-value"></span>
        <span class="wide usage-reset"></span>
      </div>
    </template>
    <footer>
      <button class="wide hidden-toggle" id="hidden-sessions" aria-expanded="false" aria-controls="sessions" hidden></button>
    </footer>
    <p class="wide health error" id="error" role="alert" hidden></p>
    </section>
    <section id="settings-view" class="settings-view" aria-label="Settings" hidden>
      <header id="settings-handle" class="panel-handle settings-header">
        <button id="settings-back" aria-label="Back to threads"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9.5 4-4 4 4 4"/></svg></button>
        <h1>Settings</h1>
      </header>
      <div class="settings-content">
        <fieldset id="appearance">
          <legend>Theme</legend>
          <div class="theme-choices">
            <label><input type="radio" name="theme" value="system" checked><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="10" rx="2"/><path d="M10 13v4M6 17h8"/></svg>System</label>
            <label><input type="radio" name="theme" value="light"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.3 4.3l1.4 1.4m8.6 8.6 1.4 1.4M4.3 15.7l1.4-1.4m8.6-8.6 1.4-1.4"/></svg>Light</label>
            <label><input type="radio" name="theme" value="dark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12A7 7 0 0 1 8 3.5 7 7 0 1 0 16.5 12Z"/></svg>Dark</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Sources</legend>
          <div id="adapters"></div>
        </fieldset>
        <section class="settings-updates" aria-label="App updates"><h2>Updates</h2>
        <progress id="progress" max="100" aria-label="Update download" hidden></progress>
        <button id="update" disabled>Check for updates</button>
        <p id="update-detail" hidden></p>
        </section>
        <p id="settings-error" role="alert" hidden></p>
      </div>
      <footer id="settings-footer"><button id="quit">Quit</button><span id="version"></span></footer>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
