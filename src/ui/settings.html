<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
  <title>Session Lights settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main aria-label="Settings">
    <fieldset id="appearance">
      <legend>Appearance</legend>
      <div class="theme-choices">
        <label><input type="radio" name="theme" value="system" checked>System</label>
        <label><input type="radio" name="theme" value="light">Light</label>
        <label><input type="radio" name="theme" value="dark">Dark</label>
      </div>
    </fieldset>
    <progress id="progress" max="100" aria-label="Update download" hidden></progress>
    <fieldset>
      <legend>Adapters</legend>
      <div id="adapters"></div>
    </fieldset>
    <button id="update" disabled>Check for updates</button>
    <footer><button id="quit">Quit</button><span id="version"></span></footer>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
