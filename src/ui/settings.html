<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
  <title>Session Lights settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main aria-label="Settings">
    <div class="update-row"><button id="update" disabled>Check for updates</button><button id="close" aria-label="Close settings">×</button></div>
    <progress id="progress" max="100" aria-label="Update download" hidden></progress>
    <fieldset aria-describedby="adapter-help">
      <legend>Adapters</legend>
      <p id="adapter-help">Choose which adapters appear. Monitoring continues when an adapter is hidden.</p>
      <div id="adapters"></div>
    </fieldset>
    <label class="usage-toggle"><input id="codex-usage" type="checkbox" aria-describedby="usage-warning"> Read Codex usage limits</label>
    <p id="usage-warning">Starts the installed Codex runtime. It can write or migrate Codex data and use your sign-in. Off by default.</p>
    <footer><button id="quit">Quit</button><span id="version"></span></footer>
    <p id="error" role="alert" hidden></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
